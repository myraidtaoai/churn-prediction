name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: |
          ruff format --check src tests
          ruff check src tests --output-format=github

      - name: Run tests
        run: |
          python -m pytest

  bundle-validate:
    name: Bundle dry-run validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run when Databricks secrets are configured (skip on forks).
    if: vars.DATABRICKS_HOST != ''
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Dev bundle
        run: >-
          databricks bundle validate -t dev
          --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"
