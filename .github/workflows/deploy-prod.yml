name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit SHA from a successful Deploy Dev run
        required: true
        type: string
      deployment_reason:
        description: Change or release being approved
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify the revision passed Dev deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Find successful Dev deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "${RELEASE_SHA}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "release_sha must be a full 40-character Git commit SHA."
            exit 1
          fi
          successful_runs="$(gh run list \
            --workflow deploy-dev.yml \
            --commit "${RELEASE_SHA}" \
            --status success \
            --json databaseId \
            --jq 'length')"
          if [ "${successful_runs}" -lt 1 ]; then
            echo "No successful Deploy Dev run exists for ${RELEASE_SHA}."
            exit 1
          fi

  deploy-production:
    name: Deploy Production
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}

    steps:
      - name: Check out the Dev-verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify authentication
        run: databricks current-user me

      - name: Validate Production bundle
        run: databricks bundle validate -t prod

      - name: Deploy Production bundle
        run: databricks bundle deploy -t prod

      - name: Summarize Production deployment
        run: databricks bundle summary -t prod
