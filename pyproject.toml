[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/churn_pipeline"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    ".databricks",
    "outputs",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]