[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src/churn_pipeline",
    "src/churn_pipeline/ingestion",
    "src/churn_pipeline/transformation",
    "src/churn_pipeline/modeling",
    "src/churn_pipeline/ops",
]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    ".databricks",
    "outputs",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"src/churn_pipeline/ingestion/*.py" = ["E402", "I001"]
"src/churn_pipeline/transformation/*.py" = ["E402", "I001"]
"src/churn_pipeline/modeling/*.py" = ["E402", "I001"]
"src/churn_pipeline/ops/*.py" = ["E402", "I001"]